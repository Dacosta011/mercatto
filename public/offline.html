<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0D0F14">
  <title>Mercatto — Sin conexión</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100dvh;display:flex;align-items:center;justify-content:center;
      background:#0D0F14;color:#F3F4F6;
      font-family:system-ui,-apple-system,sans-serif;padding:24px;
    }
    .c{text-align:center;max-width:340px}
    .icon{
      width:64px;height:64px;border-radius:16px;
      background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);
      display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
      padding:10px;
    }
    .icon svg{width:100%;height:auto}
    h1{font-size:18px;font-weight:600;margin-bottom:8px}
    p{font-size:14px;color:#9CA3AF;line-height:1.5;margin-bottom:24px}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:12px 24px;border-radius:12px;
      background:#8B5CF6;color:#fff;font-size:14px;font-weight:600;
      border:none;cursor:pointer;transition:background .2s;
    }
    .btn:active{background:#7C3AED}
    .sub{font-size:12px;color:#6B7280;margin-top:16px}
  </style>
</head>
<body>
  <div class="c">
    <div class="icon">
      <svg width="170" height="141" viewBox="0 0 170 141" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M121.5 28L62 89.5C60.2321 91.8198 60.2184 93.0242 62 95L73.5 105C80.1147 109.808 83.5775 109.278 89.5 105L151 47V40C151 40 152 38 153 39C154 40 158.5 51.5 158.5 51.5C160.236 52.9394 161.107 52.8999 162.5 51.5L169.5 0L119 17C117.782 18.0086 117.63 18.6452 119 20L132 23.5C133.077 24.8668 132.905 25.6332 132 27L121.5 28Z" fill="#7B58EA"/>
        <path d="M128 78V136C128 139 128 139 130.5 139H155.5C157.428 138.994 157.81 138.134 158 136L159 63L155.5 58C152.376 54.7064 150.624 54.5156 147.5 58L128 78Z" fill="#7B58EA"/>
        <path d="M0 26V137C4.23015 141.86 5.99031 140.43 9 137L31 114.5V63L51 84.5C53.9133 85.5834 55.4749 85.7583 58 84.5L72.5 70C74.4525 66.8761 74.4893 65.1238 72.5 62L28 17C24.215 13.7353 21.059 12.7112 14 12C6.36093 13.4708 3.04176 16.0692 0 26Z" fill="#7B58EA"/>
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No tienes conexión a internet. Algunas funciones no están disponibles sin conexión.</p>
    <button class="btn" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
      Reintentar
    </button>
    <p class="sub">Mercatto requiere conexión para el mercado, subastas y partidos.</p>
  </div>
</body>
</html>
